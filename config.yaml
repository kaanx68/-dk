model_list:
  # 1. Claude Sonnet (Mevcut OpenRouter Kurulumun)
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192
      
      merge_reasoning_content_in_choices: true
      additional_drop_params: ["temperature", "top_p", "top_k", "frequency_penalty", "presence_penalty", "repetition_penalty"]
      
      extra_body:
        reasoning:
          effort: medium
        provider:
          order: ["anthropic"]
          allow_fallbacks: false
        cache_control:
          type: ephemeral
          ttl: 1h

  # 2. Claude Haiku (Mevcut OpenRouter Kurulumun)
  - model_name: claude-haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192
      
      merge_reasoning_content_in_choices: true
      additional_drop_params: ["temperature", "top_p", "top_k", "frequency_penalty", "presence_penalty", "repetition_penalty"]
      
      extra_body:
        reasoning:
          effort: medium
        provider:
          order: ["anthropic"]
          allow_fallbacks: false
        cache_control:
          type: ephemeral
          ttl: 1h

  # 3. Claude Opus (Mevcut OpenRouter Kurulumun)
  - model_name: claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.7
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192
      
      merge_reasoning_content_in_choices: true
      additional_drop_params: ["temperature", "top_p", "top_k", "frequency_penalty", "presence_penalty", "repetition_penalty"]
      
      extra_body:
        reasoning:
          effort: medium
        provider:
          order: ["anthropic"]
          allow_fallbacks: false
        cache_control:
          type: ephemeral
          ttl: 1h

  # 4. Gemini 4 Argon (Vertex AI - Filtresiz & Düşünce Kutusu Açık)
  - model_name: gemini-argon
    litellm_params:
      model: vertex_ai/gemini-4-argon
      vertex_project: "gen-lang-client-0302992290" # Kendi project_id değerin
      vertex_location: "global"
      vertex_credentials: "/etc/secrets/vertex.json"
      max_tokens: 32768
      
      merge_reasoning_content_in_choices: true
      additional_drop_params: ["temperature", "top_p", "top_k", "frequency_penalty", "presence_penalty", "repetition_penalty"]
      
      thinkingConfig:
            thinkingLevel: "HIGH"
            includeThoughts: true
      
      safety_settings:
        - category: "HARM_CATEGORY_HARASSMENT"
          threshold: "OFF"
        - category: "HARM_CATEGORY_HATE_SPEECH"
          threshold: "OFF"
        - category: "HARM_CATEGORY_SEXUALLY_EXPLICIT"
          threshold: "OFF"
        - category: "HARM_CATEGORY_DANGEROUS_CONTENT"
          threshold: "OFF"

  # 5. Gemini 3.8 Flash (Vertex AI - Global Endpoint & Düşünce Kutusu Açık)
  - model_name: gemini-flash
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: "gen-lang-client-0302992290" # Kendi project_id değerin
      vertex_location: "global" # 404 hatasını çözmek için global yapıldı
      vertex_credentials: "/etc/secrets/vertex.json"
      max_tokens: 32768
      
      reasoning_effort: "medium"
      merge_reasoning_content_in_choices: true
      additional_drop_params: ["temperature", "top_p", "top_k", "frequency_penalty", "presence_penalty", "repetition_penalty"]
      
      extra_body:
        generationConfig:
          thinkingConfig:
            thinkingLevel: "MEDIUM"
            includeThoughts: true
      
      safety_settings:
        - category: "HARM_CATEGORY_HARASSMENT"
          threshold: "OFF"
        - category: "HARM_CATEGORY_HATE_SPEECH"
          threshold: "OFF"
        - category: "HARM_CATEGORY_SEXUALLY_EXPLICIT"
          threshold: "OFF"
        - category: "HARM_CATEGORY_DANGEROUS_CONTENT"
          threshold: "OFF"

litellm_settings:
  drop_params: true
