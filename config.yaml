model_list:
  # 1. Claude Sonnet
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5:anthropic
      api_key: "os.environ/OPENROUTER_API_KEY"
      max_tokens: 8192
      extra_body:
        include_reasoning: true
        reasoning:
          max_tokens: 2048
      cache_control_injection_points:
        - location: "message"
          role: "system"
          control:
            type: "ephemeral"
            ttl: "1h"

  # 2. Claude Haiku
  - model_name: claude-haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5:anthropic
      api_key: "os.environ/OPENROUTER_API_KEY"
      max_tokens: 8192
      extra_body:
        include_reasoning: true
        reasoning:
          max_tokens: 2048
      cache_control_injection_points:
        - location: "message"
          role: "system"
          control:
            type: "ephemeral"
            ttl: "1h"

  # 3. Claude Opus
  - model_name: claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.7:anthropic
      api_key: "os.environ/OPENROUTER_API_KEY"
      max_tokens: 8192
      extra_body:
        include_reasoning: true
        reasoning:
          max_tokens: 2048
      cache_control_injection_points:
        - location: "message"
          role: "system"
          control:
            type: "ephemeral"
            ttl: "1h"

litellm_settings:
  return_response_reasoning_content: true
  
