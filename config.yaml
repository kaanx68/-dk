model_list:
  # 1. Claude Sonnet
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192
      
      merge_reasoning_content_in_choices: true
      additional_drop_params: ["temperature", "top_p", "top_k", "frequency_penalty", "presence_penalty", "repetition_penalty"]
      
      extra_body:
        reasoning:
          effort: medium
        provider:
          order: ["anthropic"]
          allow_fallbacks: false
        cache_control:
          type: ephemeral
          ttl: 1h

